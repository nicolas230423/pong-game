<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong Game</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #111111;
      --panel: #1f2933;
      --court: #050505;
      --line: #f7f7f7;
      --accent: #2dd4bf;
      --text: #f5f5f5;
      --muted: #b8c2cc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(920px, calc(100% - 32px));
      display: grid;
      gap: 16px;
      justify-items: center;
      padding: 24px 0;
    }

    h1 {
      margin: 0;
      font-size: 40px;
      line-height: 1.1;
      text-align: center;
    }

    .score {
      width: 100%;
      padding: 12px 16px;
      display: flex;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      background: var(--panel);
      font-size: 24px;
      font-weight: 700;
      text-align: center;
    }

    canvas {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 2 / 1;
      display: block;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: var(--court);
    }

    .instructions {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      text-align: center;
    }

    .key {
      padding: 2px 7px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 6px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      font-weight: 700;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      padding: 10px 20px;
      border: 2px solid var(--accent);
      border-radius: 8px;
      background: rgba(45, 212, 191, 0.1);
      color: var(--accent);
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: rgba(45, 212, 191, 0.2);
      box-shadow: 0 0 12px rgba(45, 212, 191, 0.3);
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <main>
    <h1>Pong Game</h1>
    <div class="score" id="score">Jugador 1: 0 | Jugador 2: 0</div>
    <canvas id="pong" width="800" height="400" aria-label="Cancha del juego Pong"></canvas>
    <p class="instructions">
      Jugador 1: <span class="key">ArrowUp</span> <span class="key">ArrowDown</span>
      | Jugador 2: <span class="key">W</span> <span class="key">S</span>
    </p>
    <div class="buttons">
      <button id="pauseBtn">Pausar</button>
      <button id="resetBtn">Reiniciar</button>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('pong');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');

    const paddle = {
      width: 10,
      height: 100,
      speed: 10
    };

    const player1 = {
      x: 0,
      y: canvas.height / 2 - paddle.height / 2,
      width: paddle.width,
      height: paddle.height,
      up: false,
      down: false
    };

    const player2 = {
      x: canvas.width - paddle.width,
      y: canvas.height / 2 - paddle.height / 2,
      width: paddle.width,
      height: paddle.height,
      up: false,
      down: false
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 10,
      dx: 5,
      dy: 5,
      baseSpeed: 5,
      speedIncrement: 0.001,
      color: '#2dd4bf',
      defaultColor: '#2dd4bf'
    };

    const confetti = [];

    const score = {
      player1: 0,
      player2: 0
    };

    let isPaused = false;

    function getRandomColor() {
      const letters = '0123456789ABCDEF';
      let color = '#';
      for (let i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
      }
      return color;
    }

    function createConfetti() {
      for (let i = 0; i < 50; i++) {
        confetti.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8 - 2,
          color: getRandomColor(),
          life: 100,
          size: Math.random() * 4 + 2
        });
      }
    }

    function updateConfetti() {
      for (let i = confetti.length - 1; i >= 0; i--) {
        const p = confetti[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1; // gravedad
        p.life -= 2;
        if (p.life <= 0) {
          confetti.splice(i, 1);
        }
      }
    }

    function drawConfetti() {
      for (let p of confetti) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 100;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.globalAlpha = 1;
      }
    }

    const controls = {
      ArrowUp: ['player1', 'up'],
      ArrowDown: ['player1', 'down'],
      w: ['player2', 'up'],
      W: ['player2', 'up'],
      s: ['player2', 'down'],
      S: ['player2', 'down']
    };

    function setControlState(key, isPressed) {
      const control = controls[key];

      if (!control) {
        return;
      }

      const [player, direction] = control;
      const target = player === 'player1' ? player1 : player2;
      target[direction] = isPressed;
    }

    function drawCourt() {
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
      ctx.setLineDash([12, 14]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawPaddle(player) {
      ctx.fillStyle = '#f7f7f7';
      ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    function drawBall() {
      ctx.fillStyle = ball.color;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      drawCourt();
      drawPaddle(player1);
      drawPaddle(player2);
      drawBall();
      drawConfetti();
    }

    function movePlayer(player) {
      if (player.up && player.y > 0) {
        player.y -= paddle.speed;
      }

      if (player.down && player.y < canvas.height - player.height) {
        player.y += paddle.speed;
      }
    }

    function hasPaddleCollision(player) {
      const isInsideY = ball.y > player.y && ball.y < player.y + player.height;
      const touchesLeftPaddle = ball.x - ball.radius <= player.x + player.width;
      const touchesRightPaddle = ball.x + ball.radius >= player.x;

      if (player === player1) {
        return touchesLeftPaddle && isInsideY;
      }

      return touchesRightPaddle && isInsideY;
    }

    function resetBall(direction) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.baseSpeed = 5; // Resetear velocidad al inicio
      
      // Generar ángulo que siempre apunte hacia el jugador (izquierda o derecha)
      let randomAngle;
      if (direction === 1) {
        // Dirección hacia la derecha: ángulo entre -π/4 y π/4
        randomAngle = (Math.random() - 0.5) * (Math.PI / 2);
      } else {
        // Dirección hacia la izquierda: ángulo entre 3π/4 y 5π/4
        randomAngle = Math.PI + (Math.random() - 0.5) * (Math.PI / 2);
      }
      
      ball.dx = Math.cos(randomAngle) * ball.baseSpeed;
      ball.dy = Math.sin(randomAngle) * ball.baseSpeed;
    }

    function togglePause() {
      isPaused = !isPaused;
      document.getElementById('pauseBtn').textContent = isPaused ? 'Reanudar' : 'Pausar';
    }

    function resetGame() {
      score.player1 = 0;
      score.player2 = 0;
      ball.baseSpeed = 5;
      ball.color = ball.defaultColor;
      isPaused = false;
      confetti.length = 0;
      document.getElementById('pauseBtn').textContent = 'Pausar';
      resetBall(1);
      updateScore();
    }

    function updateScore() {
      scoreElement.textContent = `Jugador 1: ${score.player1} | Jugador 2: ${score.player2}`;
    }

    function update() {
      if (isPaused) return;

      movePlayer(player1);
      movePlayer(player2);

      // Aumentar velocidad gradualmente
      ball.baseSpeed += ball.speedIncrement;
      const speed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
      const speedRatio = ball.baseSpeed / speed;
      ball.dx *= speedRatio;
      ball.dy *= speedRatio;

      ball.x += ball.dx;
      ball.y += ball.dy;

      updateConfetti();

      if (ball.y + ball.radius >= canvas.height || ball.y - ball.radius <= 0) {
        ball.dy *= -1;
      }

      if (hasPaddleCollision(player1)) {
        ball.dx = Math.abs(ball.dx);
      }

      if (hasPaddleCollision(player2)) {
        ball.dx = -Math.abs(ball.dx);
      }

      if (ball.x + ball.radius < 0) {
        score.player2 += 1;
        ball.color = getRandomColor();
        createConfetti();
        resetBall(1);
      }

      if (ball.x - ball.radius > canvas.width) {
        score.player1 += 1;
        ball.color = getRandomColor();
        createConfetti();
        resetBall(-1);
      }

      updateScore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', (event) => {
      setControlState(event.key, true);
    });

    document.addEventListener('keyup', (event) => {
      setControlState(event.key, false);
    });

    document.getElementById('pauseBtn').addEventListener('click', togglePause);
    document.getElementById('resetBtn').addEventListener('click', resetGame);

    gameLoop();
  </script>
</body>
</html>
