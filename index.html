<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Pong Game</title>\n    <style>\n        body {\n            display: flex;\n            flex-direction: column;\n            align-items: center;\n            justify-content: center;\n            height: 100vh;\n            background-color: #000;\n            color: #fff;\n        }\n        canvas {\n            border: 1px solid #fff;\n        }\n        #score {\n            font-size: 24px;\n            margin: 20px;\n        }\n    </style>\n</head>\n<body>\n    <h1>Pong Game</h1>\n    <div id="score">Score: Player1 0 - 0 Player2</div>\n    <canvas id="pong" width="800" height="400"></canvas>\n    <div id="instructions">Instructions: Use arrow keys for player 1 and W/S keys for player 2.</div>\n    <script>\n        const canvas = document.getElementById('pong');\n        const ctx = canvas.getContext('2d');\n        // Game Variables\n        const paddleWidth = 10;\n        const paddleHeight = 100;\n        let player1Score = 0;\n        let player2Score = 0;\n        // Paddle Positions\n        const player1 = {\n            x: 0,\n            y: canvas.height / 2 - paddleHeight / 2,\n            width: paddleWidth,\n            height: paddleHeight,\n            up: false,\n            down: false\n        };\n        const player2 = {\n            x: canvas.width - paddleWidth,\n            y: canvas.height / 2 - paddleHeight / 2,\n            width: paddleWidth,\n            height: paddleHeight,\n            up: false,\n            down: false\n        };\n        const ball = {\n            x: canvas.width / 2,\n            y: canvas.height / 2,\n            radius: 10,\n            speed: 5,\n            dx: 5,\n            dy: 5\n        };\n        // Control Setup\n        document.addEventListener('keydown', (event) => {\n            switch(event.key) {\n                case 'ArrowUp':\n                    player1.up = true;\n                    break;\n                case 'ArrowDown':\n                    player1.down = true;\n                    break;\n                case 'w':\n                    player2.up = true;\n                    break;\n                case 's':\n                    player2.down = true;\n                    break;\n            }\n        });\n        document.addEventListener('keyup', (event) => {\n            switch(event.key) {\n                case 'ArrowUp':\n                    player1.up = false;\n                    break;\n                case 'ArrowDown':\n                    player1.down = false;\n                    break;\n                case 'w':\n                    player2.up = false;\n                    break;\n                case 's':\n                    player2.down = false;\n                    break;\n            }\n        });\n        function draw() {\n            // Clear Canvas\n            ctx.clearRect(0, 0, canvas.width, canvas.height);\n            // Draw Paddle 1\n            ctx.fillStyle = '#fff';\n            ctx.fillRect(player1.x, player1.y, player1.width, player1.height);\n            // Draw Paddle 2\n            ctx.fillRect(player2.x, player2.y, player2.width, player2.height);\n            // Draw Ball\n            ctx.beginPath();\n            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);\n            ctx.fill();\n        }\n        function update() {\n            // Move Paddles\n            if (player1.up && player1.y > 0) player1.y -= 10;\n            if (player1.down && player1.y < canvas.height - player1.height) player1.y += 10;\n            if (player2.up && player2.y > 0) player2.y -= 10;\n            if (player2.down && player2.y < canvas.height - player2.height) player2.y += 10;\n            // Move Ball\n            ball.x += ball.dx;\n            ball.y += ball.dy;\n            // Bounce Ball\n            if (ball.y + ball.radius >= canvas.height || ball.y - ball.radius <= 0) ball.dy *= -1;\n            // Collision with paddles\n            if (ball.x - ball.radius <= player1.x + player1.width && ball.y > player1.y && ball.y < player1.y + player1.height) ball.dx *= -1;\n            if (ball.x + ball.radius >= player2.x && ball.y > player2.y && ball.y < player2.y + player2.height) ball.dx *= -1;\n            // Scoring\n            if (ball.x + ball.radius < 0) {\n                player2Score++;\n                resetBall();\n            }\n            if (ball.x - ball.radius > canvas.width) {\n                player1Score++;\n                resetBall();\n            }\n            // Update Score\n            document.getElementById('score').innerText = `Score: Player1 ${player1Score} - ${player2Score} Player2`;\n        }\n        function resetBall() {\n            ball.x = canvas.width / 2;\n            ball.y = canvas.height / 2;\n            ball.dx *= -1;\n        }\n        function gameLoop() {\n            draw();\n            update();\n            requestAnimationFrame(gameLoop);\n        }\n        // Start Game Loop\n        gameLoop();\n    </script>\n</body>\n</html>
